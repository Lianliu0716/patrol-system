    <script>
        //ScrollBar
        var get = {
            byId: function (id) {
                return typeof id === "string" ? document.getElementById(id) : id
            }, byClass: function (sClass, oParent) {
                var aClass = []; var reClass = new RegExp("(^| )" + sClass + "( |$)"); var aElem = this.byTagName("*", oParent); for (var i = 0; i < aElem.length; i++) reClass.test(aElem[i].className) && aClass.push(aElem[i]); return aClass
            }, byTagName: function (elem, obj) {
                return (obj || document).getElementsByTagName(elem)
            }
        }; function getStyle(obj, attr) {
            return parseFloat(obj.currentStyle ? obj.currentStyle[attr] : getComputedStyle(obj, null)[attr])
        }
        var b = ["box", "box1", "box2"];//box
        window.onload = function () {

        function run1(a) {//html執行完 執行 window.onload 
            var oBox = get.byId(a);
            var oScrollBar = get.byClass("scrollBar", oBox)[0];
            var oList = get.byClass("list", oBox)[0];
            var oUl = get.byTagName("ul", oBox)[0];
            var aLi = get.byTagName("li", oBox);
            var oBarL = get.byClass("barL", oScrollBar)[0];
            var oBarM = get.byClass("barM", oScrollBar)[0];
            var oBarR = get.byClass("barR", oScrollBar)[0];
            var oBar = get.byClass("bar", oBarM)[0];
            var maxL = oBarM.offsetWidth - oBar.offsetWidth;
            var iMarginRight = getStyle(aLi[0], "marginRight");
            var timer = null; var iScale = 0; var disX = 0; var i = 0;
            oUl.style.width = (aLi[0].offsetWidth + iMarginRight) * aLi.length + "px";
            oBar.onmousedown = function (event) {

                var event = event || window.event; disX = event.clientX - oBar.offsetLeft; document.onmousemove = function (event) {
                    var event = event || window.event; var iL = event.clientX - disX; iL <= 0 && (iL = 0); iL >= maxL && (iL = maxL); oBar.style.left = iL + "px"; iScale = iL / maxL; return false
                }; document.onmouseup = function () {
                    startMove(oUl, parseInt((oList.offsetWidth + iMarginRight - oUl.offsetWidth) * iScale)); isStop(); document.onmousemove = null; document.onmouseup = null
                }; return false
            }; oBar.onclick = function (event) {
                (event || window.event).cancelBubble = true
            }; oBarL.onmouseover = oBarR.onmouseover = document.onkeydown = function (event) {
                clearInterval(timer); var event = event || window.event; var iSpeed = 0; if (this == oBarR || event.keyCode == 39) {
                    iSpeed = 5
                }
                else if (this == oBarL || event.keyCode == 37) {
                    iSpeed = -5
                }
                timer = setInterval(function () {
                    togetherMove(getStyle(oBar, "left") + iSpeed, 1)
                }, 30)
            }; oBarL.onmouseout = oBarR.onmouseout = document.onkeyup = function () {
                clearInterval(timer)
            }; oBarM.onclick = function (event) {
                var iTarget = (event || window.event).clientX - oBox.offsetLeft - this.offsetLeft - oBar.offsetWidth / 2; togetherMove(iTarget)
            }; oBox.onmouseover = function (event) {
                event = event || window.event; function mouseWheel(event) {
                    var delta = event.wheelDelta ? event.wheelDelta : -event.detail * 40
                    var iTarget = delta > 0 ? -50 : 50; togetherMove(oBar.offsetLeft + iTarget)
                }
                addHandler(this, "mousewheel", mouseWheel); addHandler(this, "DOMMouseScroll", mouseWheel);
            };
            function togetherMove(iTarget, buffer) {
                if (iTarget <= 0) {
                    timer && clearInterval(timer); iTarget = 0
                }
                else if (iTarget >= maxL) {
                    timer && clearInterval(timer); iTarget = maxL
                }
                iScale = iTarget / maxL; startMove(oUl, parseInt((oList.offsetWidth + iMarginRight - oUl.offsetWidth) * iScale), function () { isStop() }, buffer); startMove(oBar, iTarget, function () { isStop() }, buffer)
            }
            function isStop() {
                oBarL.className = "barL"; oBarR.className = "barR"; switch (oBar.offsetLeft) { case 0: /(^|\s)barLStop(\s|$)/.test(oBarL.className) || (oBarL.className += " barLStop"); break; case maxL: /(^|\s)barRStop(\s|$)/.test(oBarR.className) || (oBarR.className += " barRStop"); break; }
            }
            isStop()

        }; function addHandler(element, type, handler) {
            return element.addEventListener ? element.addEventListener(type, handler, false) : element.attachEvent("on" + type, handler)
        }
        function startMove(obj, iTarget, fnEnd, buffer) {
            clearInterval(obj.timer); obj.timer = setInterval(function () {
                doMove(obj, iTarget, fnEnd, buffer)
            }, 25)
        }
        function doMove(obj, iTarget, fnEnd, buffer) {
            var iLeft = getStyle(obj, "left"); var iSpeed = (iTarget - iLeft) / (buffer || 5); iSpeed = iSpeed > 0 ? Math.ceil(iSpeed) : Math.floor(iSpeed); iLeft == iTarget ? (clearInterval(obj.timer), fnEnd && fnEnd()) : obj.style.left = iLeft + iSpeed + "px"
        }

        function add_to_list(url, val, filename) {//add uplaod photo into list

                progress = ((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                console.log('Upload is ' + progress + '% done');
                switch (snapshot.state) {
                    case firebase.storage.TaskState.PAUSED:

                    case firebase.storage.TaskState.RUNNING:
                        a = await A(progress);
