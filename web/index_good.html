var storageRef=firebase.database().ref();



var file;
var uploadFileInput = document.getElementById("uploadFileInput");
uploadFileInput.addEventListener("change", function(){
	 file = this.files[0];/////
  var uploadTask = storageRef.child('images/'+file.name).put(file);
  uploadTask.on('state_changed', function(snapshot){
    // Observe state change events such as progress, pause, and resume
    // Get task progress, including the number of bytes uploaded and the total number of bytes to be uploaded
    var progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
    console.log('Upload is ' + progress + '% done');
    switch (snapshot.state) {
      case firebase.storage.TaskState.PAUSED: // or 'paused'
        console.log('Upload is paused');
        break;
      case firebase.storage.TaskState.RUNNING: // or 'running'
        console.log('Upload is running');
        break;
    }
  }, function(error) {
    // Handle unsuccessful uploads
  }, function() {
    // Handle successful uploads on complete
    // For instance, get the download URL: https://firebasestorage.googleapis.com/...
    var downloadURL = uploadTask.snapshot.downloadURL;
  });
},false);


var PATH;
var getPicBtn = document.getElementById("getPicBtn");
var downloadedImg = document.getElementById("downloadedImg");
var db=firebase.database();//弄掉realtime base 的亂碼
db.ref('URL').limitToLast(1).once('value', function (snapshot) {
   // var data = snapshot.val();
    //console.log(data);
    snapshot.forEach(function (item) {
        console.log(item.val().Path);
        PATH=item.val().Path;//圖片下載路徑
    })
   
 });///////
getPicBtn.addEventListener("click", function(){  
  	downloadedImg.src = PATH;//url
}, false)
